repos:
-   repo: local
    hooks:
    - id: flake8
      name: flake8 (code linting)
      language: system
      entry: uv run --frozen flake8
      types: [python]
-   repo: local
    hooks:
    - id: black
      name: black (code formatting)
      language: system
      entry: uv run --frozen black
      types: [python]
-   repo: local
    hooks:
    - id: mypy
      name: mypy (static typing)
      pass_filenames: false
      language: system
      entry: uv run --frozen poe mypy
      verbose: true
